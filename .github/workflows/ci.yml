name: CI

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure
        run: cmake -S . -B build-arraylib

      - name: Build
        run: cmake --build build-arraylib

      - name: Test
        run: ctest --test-dir build-arraylib --output-on-failure